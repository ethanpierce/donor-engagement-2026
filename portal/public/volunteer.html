<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171411" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Tidepath</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Inter:wght@400..700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-title="vol.title">
<a class="skip" href="#main" data-i18n="skip">Skip to the form</a>
<header class="top">
  <div class="top-inner">
    <a class="logo" href="/" data-keep-lang><svg class="mark" viewBox="0 0 20 16" aria-hidden="true"><rect x="1" y="1" width="18" height="14" rx="2"/><path d="M1.5 2.5 10 9l8.5-6.5"/></svg><span><b data-i18n="brand">Tidepath</b><small data-i18n="brand.sub">Family Alliance</small></span></a>
    <div class="lang-switch" role="group" aria-label="Language / Idioma / Lang"></div>
  </div>
</header>
<main id="main">
<a class="back" href="/" data-keep-lang><span aria-hidden="true">&larr;</span> <span data-i18n="back">Back</span></a>
<h1 data-i18n="vol.title"></h1>
<p class="lead" data-i18n="vol.lead"></p>
<form data-form="volunteer" novalidate>
<div class="alert" role="alert" hidden></div>
<div class="field" data-field="name">
  <label for="name"><span data-i18n="vol.name"></span><span class="tag" data-i18n="req"></span></label>
  <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-err" maxlength="80">
  <p class="err" id="name-err" role="alert"></p>
</div>
<div class="field" data-field="phone">
  <label for="phone"><span data-i18n="vol.phone"></span><span class="tag" data-i18n="opt"></span></label>
  <p class="hint" id="phone-hint" data-i18n="vol.phone.hint"></p>
  <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-hint phone-err" inputmode="tel" maxlength="20">
  <p class="err" id="phone-err" role="alert"></p>
</div>
<div class="row2">
<div class="field" data-field="date">
  <label for="date"><span data-i18n="vol.date"></span><span class="tag" data-i18n="req"></span></label>
  <input id="date" name="date" type="date" required aria-describedby="date-err" data-today>
  <p class="err" id="date-err" role="alert"></p>
</div>
<div class="field" data-field="hours">
  <label for="hours"><span data-i18n="vol.hours"></span><span class="tag" data-i18n="req"></span></label>
  <p class="hint" id="hours-hint" data-i18n="vol.hours.hint"></p>
  <input id="hours" name="hours" type="text" required aria-describedby="hours-hint hours-err" inputmode="decimal" maxlength="5">
  <p class="err" id="hours-err" role="alert"></p>
</div>
</div>
<div class="field" data-field="met">
  <label for="met"><span data-i18n="vol.met"></span><span class="tag" data-i18n="opt"></span></label>
  <p class="hint" id="met-hint" data-i18n="vol.met.hint"></p>
  <input id="met" name="met" type="text" aria-describedby="met-hint met-err" maxlength="40" autocomplete="off">
  <p class="err" id="met-err" role="alert"></p>
</div>
<div class="field" data-field="happened">
  <label for="happened"><span data-i18n="vol.happened"></span><span class="tag" data-i18n="req"></span></label>
  <textarea id="happened" name="happened" maxlength="600" data-i18n-ph="vol.happened.ph" required aria-describedby="happened-err"></textarea>
  <p class="err" id="happened-err" role="alert"></p>
</div>
<fieldset class="field" data-field="urgent">
  <legend><span data-i18n="vol.urgent"></span><span class="tag" data-i18n="req"></span></legend>
  <p class="hint" data-i18n="vol.urgent.hint"></p>
  <div class="choices inline">
    <label class="choice"><input type="radio" name="urgent" value="no" required><span><span data-i18n="no"></span></span></label>
    <label class="choice"><input type="radio" name="urgent" value="yes" required><span><span data-i18n="yes"></span></span></label>
  </div>
  <p class="err" role="alert"></p>
</fieldset>
<div class="sub-box" data-show-if="urgent=yes" hidden>
<div class="field" data-field="urgentText">
  <label for="urgentText"><span data-i18n="vol.urgentText"></span><span class="tag" data-i18n="req"></span></label>
  <textarea id="urgentText" name="urgentText" maxlength="300" required aria-describedby="urgentText-err"></textarea>
  <p class="err" id="urgentText-err" role="alert"></p>
</div>
</div>
<div class="field" data-field="photo">
  <span class="label"><span data-i18n="vol.photo"></span><span class="tag" data-i18n="opt"></span></span>
  <p class="hint" data-i18n="vol.photo.hint"></p>
  <label class="file"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><span aria-hidden="true">+</span> <span data-i18n="vol.photo"></span></label>
  <div class="photo-preview" hidden><img alt=""><button type="button" class="btn secondary photo-remove"><span data-i18n="vol.photo.remove"></span></button></div>
  <p class="err" role="alert"></p>
</div>
<div hidden aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
<button class="btn" type="submit"><span data-i18n="send"></span></button>
</form>
</main>
<footer>
  <p class="demo" data-i18n="footer.demo">Made-up demo.</p>
  <p data-i18n="footer.privacy"></p>
</footer>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
