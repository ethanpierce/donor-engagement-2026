<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e63">
<meta name="robots" content="noindex">
<title>Tidepath</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-title="thanks.title">
<a class="skip" href="#main" data-i18n="skip">Skip to the form</a>
<header class="top">
  <div class="top-inner">
    <a class="logo" href="/" data-keep-lang><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff" opacity=".16"/><path d="M6 24c4-4 8-4 12 0s8 4 12 0 6-3 8-2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M8 17c3.5-3 7-3 10.5 0s7 3 10.5 0" fill="none" stroke="#f3b36b" stroke-width="3" stroke-linecap="round"/></svg><span><b data-i18n="brand">Tidepath</b><small data-i18n="brand.sub">Family Alliance</small></span></a>
    <div class="lang-switch" role="group" aria-label="Language / Idioma / Lang"></div>
  </div>
</header>
<main id="main">
<div class="thanks" role="status">
  <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1 data-i18n="thanks.title"></h1>
  <p class="thanks-text"></p>
  <p class="thanks-urgent" hidden data-i18n="thanks.volunteer.urgent"></p>
  <div class="ref" hidden><span data-i18n="thanks.ref"></span><br><span class="ref-code"></span></div>
  <p><a class="btn secondary" href="/" data-keep-lang><span data-i18n="thanks.another"></span></a></p>
</div>
</main>
<footer>
  <p class="demo" data-i18n="footer.demo">Made-up demo.</p>
  <p data-i18n="footer.privacy"></p>
</footer>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
