<!doctype html>
<!-- Speed badge for sped-up footage ("4× SPEED"), drawn at the top-right inside the app window. Placeholders: {{fonts}} {{tokens}} {{text}}. -->
<html><head><meta charset="utf-8">{{fonts}}<style>{{tokens}}
#wrap{display:inline-block;padding:20px}
.b{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 14px;border-radius:999px;background:rgba(24,8,70,.86);
 box-shadow:0 10px 24px -8px rgba(8,0,36,.7),inset 0 0 0 1px rgba(255,255,255,.12)}
.t{font:800 26px/1 Montserrat,sans-serif;color:var(--lime)}
.s{font:600 15px/1 Inter,sans-serif;color:rgba(255,255,255,.75);letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<div id="wrap"><div class="b"><span class="t">{{text}}</span><span class="s">speed</span></div></div>
</body></html>
