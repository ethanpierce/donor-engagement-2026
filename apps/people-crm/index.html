<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepath People CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--room-background,#f5f6f8);--surface:var(--room-surface,#ffffff);--card:var(--room-card,#ffffff);
  --bd:var(--room-border,#e3e6eb);--div:var(--room-divider,#eef0f3);
  --tx:var(--room-text,#18202b);--t2:var(--room-text-secondary,#556070);--t3:var(--room-text-tertiary,#8a94a3);
  --ac:#0b7285;--ac-ink:#ffffff;--ac-soft:#e3f2f4;--ac-line:#a9d6dd;
  --good:#067647;--good-bg:#e6f5ec;--warn:#a15c07;--warn-bg:#fdf3e1;--bad:#b42318;--bad-bg:#fcebe9;--neutral-bg:#eef0f3;
  --r-kid:#3b46c4;--r-kid-bg:#eceefd;--r-parent:#a3296b;--r-parent-bg:#fbedf5;--r-mentor:#0b7285;--r-mentor-bg:#e3f2f4;
  --r-volunteer:#2f6f1f;--r-volunteer-bg:#ebf5e6;--r-donor:#8a5a00;--r-donor-bg:#fbf1dc;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
[data-room-theme=dark]{
  --ac:#3fb5c6;--ac-ink:#06252b;--ac-soft:#12343a;--ac-line:#24606a;
  --good:#5fd18f;--good-bg:#123123;--warn:#f0b454;--warn-bg:#352812;--bad:#f2867a;--bad-bg:#3a1814;--neutral-bg:#262c35;
  --r-kid:#a5adff;--r-kid-bg:#22264a;--r-parent:#f19ac8;--r-parent-bg:#3d1d30;--r-mentor:#7fd3df;--r-mentor-bg:#12343a;
  --r-volunteer:#9bd585;--r-volunteer-bg:#1d3318;--r-donor:#f0c46a;--r-donor-bg:#3a2d10;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:18px;padding:0 20px;height:52px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:7px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand b{font-size:15px;white-space:nowrap}.brand span{color:var(--t2);font-size:12px;white-space:nowrap}
nav{display:flex;gap:2px;margin-left:auto;height:100%}
nav button{border:0;background:none;padding:0 12px;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
.count{min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--neutral-bg);color:var(--t2);font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.count.hot{background:var(--warn-bg);color:var(--warn)}
main{padding:18px 20px 8px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:16px;font-weight:600;margin:0}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--t2);margin:0 0 10px}
.muted{color:var(--t2)}.faint{color:var(--t3)}.small{font-size:12px}
.stack>*+*{margin-top:14px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:52px;background:var(--card);z-index:1;text-align:left;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--bd)}
td{padding:10px 12px;border-bottom:1px solid var(--div);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--ac-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:500;margin:0 4px 2px 0;white-space:nowrap}
.role-kid{background:var(--r-kid-bg);color:var(--r-kid)}.role-parent{background:var(--r-parent-bg);color:var(--r-parent)}
.role-mentor{background:var(--r-mentor-bg);color:var(--r-mentor)}.role-volunteer{background:var(--r-volunteer-bg);color:var(--r-volunteer)}
.role-donor{background:var(--r-donor-bg);color:var(--r-donor)}
.tag{background:var(--neutral-bg);color:var(--t2)}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.good{background:var(--good-bg);color:var(--good)}.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}.st.neutral{background:var(--neutral-bg);color:var(--t2)}
.btn{height:32px;padding:0 14px;border-radius:7px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--t3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}.btn.pri:hover{filter:brightness(1.07)}
.btn.link{border:0;background:none;color:var(--ac);padding:0 4px;height:auto}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{height:34px;width:260px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.search:focus{outline:2px solid var(--ac-line);border-color:var(--ac)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:0 11px;height:32px;cursor:pointer;color:var(--t2);border-right:1px solid var(--bd);font-size:13px}
.seg button:last-child{border-right:0}.seg button.on{background:var(--ac-soft);color:var(--ac);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--t2)}.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--t3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who{border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.who .n{font-weight:600;font-size:15px}.who dl{margin:8px 0 0;display:grid;grid-template-columns:64px 1fr;gap:3px 8px;font-size:13px}
.who dt{color:var(--t3)}.who dd{margin:0}
.same{background:var(--warn-bg);border-radius:4px;padding:0 4px;margin-left:-4px}
.reasons{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 12px}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.meter{width:90px;height:6px;border-radius:3px;background:var(--neutral-bg);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.meter i{display:block;height:100%;background:var(--ac);border-radius:3px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--div)}
.log{margin-top:10px;font-size:12px;color:var(--t2)}.log div{padding:2px 0}
.kidgrid{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
.kidlist{position:sticky;top:66px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.kidlist .search{width:100%;margin-bottom:8px}
.kidlist .items{overflow:auto}
.kidlist button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer}
.kidlist button:hover{background:var(--neutral-bg)}.kidlist button.on{background:var(--ac-soft);color:var(--ac);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.sess{border:1px solid var(--bd);border-radius:7px;padding:6px 6px 5px;text-align:center;font-size:11px;color:var(--t2)}
.sess i{display:block;height:6px;border-radius:3px;margin-bottom:5px}
.sess.present i{background:var(--good)}.sess.absent i{background:var(--bad)}.sess.excused i{background:var(--t3)}
.sess.absent{border-color:var(--bad);color:var(--bad);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.legend .p::before{background:var(--good)}.legend .a::before{background:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;margin-top:14px;font-weight:500}
.steps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3)}
.steps span{display:inline-flex;align-items:center;gap:5px}
.steps b{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd);display:inline-grid;place-items:center;font-size:10px}
.steps .done{color:var(--good)}.steps .done b{background:var(--good);border-color:var(--good);color:#fff}
.steps .cur{color:var(--tx);font-weight:600}.steps .cur b{border-color:var(--ac);color:var(--ac)}
.steps em{width:18px;height:1.5px;background:var(--bd)}
.risk{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1fr;gap:16px}
.risk .lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--t3);font-weight:600;margin-bottom:3px}
.risk ul{margin:0;padding-left:16px}
.reportgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.rtiles{grid-template-columns:repeat(9,1fr)}.rtiles .v{font-size:20px}
@media (max-width:1250px){.rtiles{grid-template-columns:repeat(5,1fr)}}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;font-weight:600}
.banner.good{background:var(--good-bg);color:var(--good)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.bars{display:grid;grid-template-columns:minmax(110px,auto) 1fr 52px;gap:7px 10px;align-items:center;font-size:13px}
.bars .track{height:14px;position:relative}
.bars .track i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:0 4px 4px 0;min-width:2px}
.bars .track:hover i{filter:brightness(1.12)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
footer{padding:14px 20px 18px;color:var(--t3);font-size:12px;text-align:center}
.empty{padding:28px;text-align:center;color:var(--t2)}
@media (max-width:1100px){.risk{grid-template-columns:1fr 1fr}.reportgrid{grid-template-columns:1fr}.brand span{display:none}}
@media (max-width:760px){.rtiles{grid-template-columns:1fr 1fr}.bar{height:auto;flex-wrap:wrap;padding:10px 12px 0;gap:6px}nav{margin-left:0;width:100%;overflow-x:auto;height:42px}
  main{padding:12px}.kidgrid,.pair,.risk{grid-template-columns:1fr}.kidlist{position:static;max-height:240px}.facts{grid-template-columns:1fr 1fr}
  .search{width:100%}th{top:0}.hide-sm{display:none}.head .row{width:100%}.seg{max-width:100%;overflow-x:auto}.seg button{white-space:nowrap}
  .tw{overflow-x:auto}.tw table{min-width:560px}.who dl{grid-template-columns:56px 1fr}}
</style>
</head>

id":59,"date":"2026-09-05","hours":1.5,"activity":"mentor visit","note":"","volunteer":"Ravi Patel"},{"volunteer_id":59,"date":"2026-09-12","hours":1.5,"activity":"mentor visit","note":"","volunteer":"Ravi Patel"},{"volunteer_id":59,"date":"2026-09-19","hours":1.5,"activity":"mentor visit","note":"","volunteer":"Ravi Patel"}],"atRisk":null},{"id":49,"name":"Chloe Baptiste","parent":"Monique Davis","signup":{"date":"2026-09-02","grade":"5","school":"Holmes Elementary","programs":"workshops"},"attendance":[],"mentors":[],"visits":[],"atRisk":null}],"volunteerHours":[{"name":"Maria Alvarez","hours":32.5,"visits":20},{"name":"Ben Carter","hours":24.0,"visits":16},{"name":"Fabiola Joseph","hours":24.0,"visits":16},{"name":"Hannah Levy","hours":24.0,"visits":16},{"name":"Grace Okafor","hours":21.0,"visits":14},{"name":"Ravi Patel","hours":19.5,"visits":13},{"name":"Tom Reyes","hours":15.0,"visits":5},{"name":"Carlos Mejia","hours":12.0,"visits":8},{"name":"Marcus Green","hours":12.0,"visits":8},{"name":"Daniel Kim","hours":10.5,"visits":7},{"name":"Yesenia Torres","hours":10.5,"visits":7},{"name":"Nadia Brown","hours":6.0,"visits":3},{"name":"Joe Silva","hours":2.5,"visits":1}],"atRisk":[{"kid":"Kevin Morales","reason":"missed 3 sessions in last 3 weeks; no mentor meeting since 2026-09-12","lastMeeting":"2026-09-12","parent":"Elena Morales","contact":"305-555-0101","owner":"Maria Alvarez (mentor) + family counselor"},{"kid":"Jaylen Brooks","reason":"no mentor meeting since 2026-09-05","lastMeeting":"2026-09-05","parent":"Tanya Brooks","contact":"305-555-0177","owner":"Grace Okafor (mentor)"}],"report":{"quarter":"2026Q3","start":"2026-07-01","end":"2026-10-01","measures":[["kids enrolled",25],["sessions held",13],["attendance records",199],["attendance rate","91.5%"],["mentor matches (active)",17],["mentor meetings",124],["volunteer hours",213.5],["urgent needs resolved",2],["urgent needs still open",1]],"checks":[{"check":"attendance records = unique source rows","report":199,"source":199,"ok":true},{"check":"present = source rows marked present","report":182,"source":182,"ok":true},{"check":"volunteer hours = source hours - 1 duplicate reports (1.5h)","report":213.5,"source":213.5,"ok":true},{"check":"kids enrolled = unique kids in sign-up rows","report":25,"source":25,"ok":true},{"check":"mentor matches = unique source match rows","report":17,"source":17,"ok":true}]}}/*END*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent.replace(/^\/\*DATA\*\/|\/\*END\*\/$/g, ''));
const COL = 'decisions';
// Local preview without the Roomcord bridge keeps decisions in memory.
const mem = {};
const RA = window.RoomApp || {
  me: {name: 'Alex (preview)'},
  query: async () => ({data: Object.values(mem), hasMore: false}),
  put: async (c, data, o) => (mem[o.id] = {id: o.id, rev: ((mem[o.id] || {}).rev || 0) + 1, data}),
  onChange: () => () => {}
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = Object.fromEntries(D.people.map(p => [p.id, p]));
const KID = Object.fromEntries(D.kids.map(k => [k.id, k]));
const ROLE_ORDER = ['kid', 'parent', 'mentor', 'volunteer', 'donor'];
const me = () => { const m = RA.me || {}; return m.name || m.displayName || 'Alex'; };
const S = {tab: 'people', role: 'all', q: '', onlyDupes: false, kid: (D.kids[0] || {}).id, kq: '', editing: {}};
try { Object.assign(S, JSON.parse(sessionStorage.getItem('crm-ui') || '{}'), {editing: {}}); } catch (e) {}
let dec = {}, busy = false;

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const dupeKey = d => 'dupe:' + d.key;
const weekKey = r => 'week:' + D.week + ':' + slug(r.kid);
const when = iso => iso ? new Date(iso).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '';
const day = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) : '';
const chips = rs => ROLE_ORDER.filter(r => rs.includes(r)).map(r => `<span class="chip role-${r}">${r}</span>`).join('');
const st = (cls, text) => `<span class="st ${cls}">${esc(text)}</span>`;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

async function load() {
  try {
    let out = [], cursor = null;
    do {
      const r = await RA.query(COL, cursor ? {limit: 100, cursor} : {limit: 100});
      out = out.concat(r.data || []); cursor = r.hasMore ? r.cursor : null;
    } while (cursor);
    dec = {};
    for (const r of out) { const d = r.data || {}; if (d.key) dec[d.key] = {...d, rev: r.rev}; }
  } catch (e) { toast('Could not read saved decisions: ' + (e.message || e.code || e)); }
  render();
}
async function decide(key, kind, value, extra) {
  if (busy) return; busy = true;
  const prev = dec[key];
  const entry = {value, by: me(), at: new Date().toISOString()};
  const rec = {key, kind, value, by: entry.by, at: entry.at, ...(extra || {}), log: [...((prev && prev.log) || []), entry].slice(-50)};
  try {
    const saved = await RA.put(COL, rec, prev && prev.rev ? {id: key, expectedRev: prev.rev} : {id: key});
    dec[key] = {...rec, rev: saved && saved.rev}; delete S.editing[key];
    toast('Saved: ' + label(value) + ' by ' + entry.by);
  } catch (e) {
    toast(e && e.code === 'RECORD_REV_CONFLICT' ? 'Someone changed this first. Showing the latest.' : 'Not saved: ' + ((e && (e.message || e.code)) || e));
    await load();
  }
  busy = false; render();
}
const label = v => ({merge: 'merge approved', 'not-same': 'not the same', draft: 'back to draft', approved: 'follow-up approved', sent: 'marked sent'})[v] || v;
function go(tab, extra) { Object.assign(S, {tab}, extra || {}); render(); window.scrollTo(0, 0); }
function save() { try { sessionStorage.setItem('crm-ui', JSON.stringify({tab: S.tab, role: S.role, kid: S.kid, onlyDupes: S.onlyDupes})); } catch (e) {} }

const openDupes = () => D.dupes.filter(d => !dec[dupeKey(d)]);
const weekState = r => (dec[weekKey(r)] || {}).value || 'draft';
const TABS = [
  ['people', 'People', () => [D.people.length, false]],
  ['dupes', 'Duplicates', () => [openDupes().length, openDupes().length > 0]],
  ['kid', 'Kid card'],
  ['week', 'This week', () => { const n = D.atRisk.filter(r => weekState(r) !== 'sent').length; return [n, n > 0]; }],
  ['report', 'Q3 report']
];
function render() {
  save();
  document.getElementById('who').textContent = 'Signed in as ' + me();
  document.getElementById('nav').innerHTML = TABS.map(([k, l, n]) => {
    const c = n ? n() : null;
    return `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}${c ? `<span class="count ${c[1] ? 'hot' : ''}">${c[0]}</span>` : ''}</button>`;
  }).join('');
  document.getElementById('main').innerHTML = ({people, dupes, kid, week, report})[S.tab]();
}

function dupeStatus(pid) {
  const ds = D.dupes.filter(d => d.a === pid || d.b === pid);
  if (!ds.length) return '';
  const open = ds.filter(d => !dec[dupeKey(d)]);
  if (open.length) return `<button class="btn link" data-go-dupes>${st('warn', 'possible duplicate')}</button>`;
  if (ds.some(d => dec[dupeKey(d)].value === 'merge')) return st('good', 'merge approved');
  return st('neutral', 'reviewed');
}
function people() {
  const counts = {all: D.people.length};
  for (const r of ROLE_ORDER) counts[r] = D.people.filter(p => p.roles.includes(r)).length;
  const q = S.q.trim().toLowerCase();
  const list = D.people.filter(p => (S.role === 'all' || p.roles.includes(S.role))
    && (!S.onlyDupes || p.possibleDuplicate)
    && (!q || [p.name, p.phone, p.email, p.address, p.roles.join(' '), p.relations.join(' ')].join(' ').toLowerCase().includes(q)));
  const nDup = D.people.filter(p => p.possibleDuplicate).length;
  return `<div class="card">
  <div class="pad head" style="margin:0;border-bottom:1px solid var(--bd)">
    <div class="row"><h2>People</h2><span class="muted small">${list.length} of ${D.people.length}, one row per person</span></div>
    <div class="row">
      <div class="seg">${['all', ...ROLE_ORDER].map(r => `<button class="${S.role === r ? 'on' : ''}" data-role="${r}">${r === 'all' ? 'All' : r[0].toUpperCase() + r.slice(1) + 's'} ${counts[r]}</button>`).join('')}</div>
      <div class="seg"><button class="${S.onlyDupes ? 'on' : ''}" data-only-dupes>Possible duplicates ${nDup}</button></div>
      <input class="search" id="q" placeholder="Search name, contact, relation" value="${esc(S.q)}">
    </div>
  </div>
  <div class="tw"><table><thead><tr><th style="width:26%">Name</th><th>Roles</th><th>Contact</th><th class="hide-sm">Address</th><th style="width:150px"></th></tr></thead><tbody>
  ${list.map(p => `<tr class="${p.roles.includes('kid') ? 'click' : ''}" ${p.roles.includes('kid') ? `data-kid="${p.id}"` : ''}>
    <td><div style="font-weight:600">${esc(p.name)}</div><div class="small muted">${p.relations.map(esc).join(' &middot; ')}</div></td>
    <td>${chips(p.roles)}</td>
    <td class="small">${p.phone ? esc(p.phone) + '<br>' : ''}${p.email ? `<span class="muted">${esc(p.email)}</span>` : ''}${!p.phone && !p.email ? '<span class="faint">via parent</span>' : ''}</td>
    <td class="small muted hide-sm">${esc(p.address) || '<span class="faint">none on file</span>'}</td>
    <td>${dupeStatus(p.id)}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">No one matches this search.</td></tr>`}
  </tbody></table></div></div>`;
}

function who(id, reasons) {
  const p = P[id] || {name: '#' + id, roles: [], relations: []};
  const hl = (kind, v) => v ? (reasons.some(r => r === 'same ' + kind) ? `<span class="same">${esc(v)}</span>` : esc(v)) : '<span class="faint">none</span>';
  return `<div class="who"><div class="row" style="justify-content:space-between"><span class="n">${esc(p.name)}</span><span class="faint small">record #${id}</span></div>
  <div style="margin-top:4px">${chips(p.roles)}</div>
  <dl><dt>Phone</dt><dd>${hl('phone', p.phone)}</dd><dt>Email</dt><dd>${hl('email', p.email)}</dd><dt>Address</dt><dd>${hl('address', p.address)}</dd>
  ${p.relations.length ? `<dt>Links</dt><dd>${p.relations.map(esc).join('<br>')}</dd>` : ''}</dl></div>`;
}
function dupes() {
  const decided = D.dupes.filter(d => dec[dupeKey(d)]);
  const merges = decided.filter(d => dec[dupeKey(d)].value === 'merge').length;
  const cards = D.dupes.map(d => {
    const k = dupeKey(d), r = dec[k], editing = S.editing[k];
    const status = r ? (r.value === 'merge' ? st('good', 'Merge approved') : st('neutral', 'Not the same')) : st('warn', 'Needs review');
    const buttons = `<button class="btn pri" data-decide="${k}" data-kind="dupe" data-value="merge" data-keep="${d.a}" data-drop="${d.b}">Approve merge</button>
      <button class="btn" data-decide="${k}" data-kind="dupe" data-value="not-same">Not the same</button>
      ${editing ? `<button class="btn link" data-cancel="${k}">Cancel</button>` : ''}`;
    return `<div class="card pad">
      <div class="head"><div class="row"><h2>${esc((P[d.a] || {}).name)} and ${esc((P[d.b] || {}).name)}</h2></div>
        <div class="row"><span class="muted small">Match</span><span class="score">${Math.round(d.score * 100)}%</span><span class="meter"><i style="width:${Math.round(d.score * 100)}%"></i></span>${status}</div></div>
      <div class="reasons">${d.reasons.map(x => `<span class="chip tag">${esc(x)}</span>`).join('')}</div>
      <div class="pair">${who(d.a, d.reasons)}${who(d.b, d.reasons)}</div>
      <div class="actions">${!r || editing ? buttons + `<span class="small muted">A merge keeps record #${d.a} and moves roles, contacts and history from #${d.b}.</span>`
        : `<span>${r.value === 'merge' ? 'Merge approved' : 'Marked not the same'} by <b>${esc(r.by)}</b>, ${when(r.at)}</span><button class="btn link" data-edit="${k}">Change decision</button>`}</div>
      ${r && r.log && r.log.length ? `<div class="log"><h3 style="margin:6px 0 4px">History</h3>${r.log.slice().reverse().map(l => `<div>${when(l.at)}: ${esc(label(l.value))} by ${esc(l.by)}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="summary">
    <div class="tile"><div class="k">Possible duplicate pairs</div><div class="v">${D.dupes.length}</div><div class="s">score 50% or more</div></div>
    <div class="tile"><div class="k">Waiting for review</div><div class="v">${D.dupes.length - decided.length}</div><div class="s">approve or reject each pair</div></div>
    <div class="tile"><div class="k">Merges approved</div><div class="v">${merges}</div><div class="s">the CRM agent runs them</div></div>
    <div class="tile"><div class="k">Not the same</div><div class="v">${decided.length - merges}</div><div class="s">kept as two people</div></div>
  </div><div class="stack">${cards || '<div class="card empty">No possible duplicates.</div>'}</div>`;
}

function kid() {
  const k = KID[S.kid] || D.kids[0];
  if (!k) return '<div class="card empty">No kids enrolled.</div>';
  const kq = S.kq.trim().toLowerCase();
  const list = D.kids.filter(x => !kq || x.name.toLowerCase().includes(kq)).sort((a, b) => (!!b.atRisk - !!a.atRisk) || a.name.localeCompare(b.name));
  const pres = k.attendance.filter(a => a.status === 'present').length;
  const rate = k.attendance.length ? Math.round(100 * pres / k.attendance.length) : 0;
  const hrs = k.visits.reduce((s, v) => s + v.hours, 0);
  const active = k.mentors.find(m => m.status === 'active');
  const programs = (k.signup.programs || '').split(';').filter(Boolean);
  return `<div class="kidgrid">
  <div class="card pad kidlist"><input class="search" id="kq" placeholder="Find a kid" value="${esc(S.kq)}">
    <div class="small faint" style="margin:0 2px 6px">${D.kids.length} kids. Dot = at risk this week.</div>
    <div class="items">${list.map(x => `<button class="${x.id === k.id ? 'on' : ''}" data-pick="${x.id}"><span>${esc(x.name)}</span>${x.atRisk ? '<span class="dot" title="At risk this week"></span>' : ''}</button>`).join('')}</div></div>
  <div class="stack">
    <div class="card pad">
      <div class="head" style="margin:0"><div><h2 style="font-size:20px">${esc(k.name)}</h2>
        <div class="muted">Grade ${esc(k.signup.grade)}, ${esc(k.signup.school)} &middot; parent ${esc(k.parent)}</div></div>
        <div>${programs.map(p => `<span class="chip tag">${esc(p)}</span>`).join('')}</div></div>
      ${k.atRisk ? `<div class="alert">At risk, week of ${day(D.week)}: ${esc(k.atRisk)}. <button class="btn link" data-tab="week">See follow-up</button></div>` : ''}
      <div class="facts">
        <div class="tile"><div class="k">Signed up</div><div class="v">${day(k.signup.date)}</div><div class="s">${esc(k.signup.date.slice(0, 4))}</div></div>
        <div class="tile"><div class="k">Attendance</div><div class="v">${rate}%</div><div class="s">${pres} of ${k.attendance.length} sessions</div></div>
        <div class="tile"><div class="k">Mentor</div><div class="v" style="font-size:17px;line-height:1.75">${active ? esc(active.mentor) : 'None yet'}</div><div class="s">${active ? 'since ' + day(active.match_date) : 'needs a match'}</div></div>
        <div class="tile"><div class="k">Mentor and volunteer time</div><div class="v">${hrs.toFixed(1)} h</div><div class="s">${k.visits.length} visits</div></div>
      </div>
    </div>
    <div class="card pad"><h3>Attendance timeline</h3>
      ${k.attendance.length ? `<div class="timeline">${k.attendance.map(a => `<div class="sess ${esc(a.status)}" title="${esc(a.session)}, ${esc(a.date)}: ${esc(a.status)}"><i></i>${day(a.date)}<br>${a.status === 'present' ? 'present' : esc(a.status)}</div>`).join('')}</div>
      <div class="legend"><span class="p">present</span><span class="a">absent</span><span>${esc(k.attendance[0].session)}</span></div>` : '<div class="muted">No sessions yet.</div>'}
    </div>
    <div class="card pad"><h3>Mentor matches</h3>
      ${k.mentors.length ? k.mentors.map(m => `<div class="row" style="padding:3px 0"><b>${esc(m.mentor)}</b>${st(m.status === 'active' ? 'good' : 'neutral', m.status)}<span class="muted small">matched ${day(m.match_date)}, ${esc(m.match_date.slice(0, 4))}</span></div>`).join('') : st('warn', 'no mentor matched')}
    </div>
    <div class="card"><div class="pad" style="padding-bottom:0"><h3>Volunteer visits</h3></div>
      ${k.visits.length ? `<table><thead><tr><th>Date</th><th>Volunteer</th><th>Activity</th><th class="num">Hours</th>${k.visits.some(v => v.note) ? '<th class="hide-sm">Note</th>' : ''}</tr></thead><tbody>
      ${k.visits.slice().reverse().map(v => `<tr><td>${day(v.date)}</td><td>${esc(v.volunteer)}</td><td>${esc(v.activity)}</td><td class="num">${v.hours.toFixed(1)}</td>${k.visits.some(x => x.note) ? `<td class="muted small hide-sm">${esc(v.note)}</td>` : ''}</tr>`).join('')}</tbody></table>` : '<div class="pad muted">No visits logged.</div>'}
    </div>
  </div></div>`;
}

function steps(state) {
  const order = ['draft', 'approved', 'sent'], i = order.indexOf(state);
  return `<div class="steps">${order.map((s, j) => `${j ? '<em></em>' : ''}<span class="${j < i || (j === i && j > 0) ? 'done' : j === i ? 'cur' : ''}"><b>${j < i || (j === i && j > 0) ? '&#10003;' : j + 1}</b>${s}</span>`).join('')}</div>`;
}
function week() {
  const n = D.atRisk.length, approved = D.atRisk.filter(r => weekState(r) === 'approved').length, sent = D.atRisk.filter(r => weekState(r) === 'sent').length;
  const cards = D.atRisk.map(r => {
    const k = weekKey(r), d = dec[k], s = weekState(r);
    const kidRec = D.kids.find(x => x.name === r.kid);
    const act = s === 'draft' ? `<button class="btn pri" data-decide="${k}" data-kind="followup" data-value="approved">Approve follow-up</button>`
      : s === 'approved' ? `<button class="btn pri" data-decide="${k}" data-kind="followup" data-value="sent">Mark sent</button><button class="btn" data-decide="${k}" data-kind="followup" data-value="draft">Back to draft</button>`
      : '';
    return `<div class="card pad">
      <div class="head"><div class="row"><h2>${esc(r.kid)}</h2>${kidRec ? `<button class="btn link" data-kid="${kidRec.id}">Open kid card</button>` : ''}</div>${steps(s)}</div>
      <div class="risk">
        <div><div class="lab">Why flagged</div><ul>${r.reason.split('; ').map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <div><div class="lab">Follow-up owner</div>${esc(r.owner)}<div class="small muted" style="margin-top:4px">Last mentor meeting ${r.lastMeeting ? day(r.lastMeeting) : 'none'}</div></div>
        <div><div class="lab">Parent contact</div>${esc(r.parent)}<div class="small muted">${esc(r.contact)}</div></div>
        <div><div class="lab">Status</div>${st(s === 'sent' ? 'good' : s === 'approved' ? 'warn' : 'neutral', s)}${d ? `<div class="small muted" style="margin-top:4px">${esc(label(d.value))} by ${esc(d.by)}, ${when(d.at)}</div>` : '<div class="small muted" style="margin-top:4px">Waiting for approval</div>'}</div>
      </div>
      ${act ? `<div class="actions">${act}<span class="small muted">${s === 'draft' ? 'Approval lets the owner contact the parent.' : 'Mark sent after the owner contacts the parent.'}</span></div>` : ''}
      ${d && d.log && d.log.length > 1 ? `<div class="log">${d.log.slice().reverse().map(l => `<div>${when(l.at)}: ${esc(label(l.value))} by ${esc(l.by)}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="summary">
    <div class="tile"><div class="k">Week of</div><div class="v">${day(D.week)}</div><div class="s">${esc(D.week.slice(0, 4))}, mentoring kids only</div></div>
    <div class="tile"><div class="k">At risk</div><div class="v">${n}</div><div class="s">of ${D.kids.filter(x => (x.signup.programs || '').includes('mentoring')).length} mentoring kids</div></div>
    <div class="tile"><div class="k">Draft</div><div class="v">${n - approved - sent}</div><div class="s">needs approval</div></div>
    <div class="tile"><div class="k">Approved, not sent</div><div class="v">${approved}</div><div class="s">owner contacts parent</div></div>
    <div class="tile"><div class="k">Sent</div><div class="v">${sent}</div><div class="s">done this week</div></div>
  </div><div class="stack">${cards || '<div class="card empty">No kids at risk this week.</div>'}</div>`;
}

function report() {
  const R = D.report, ok = R.checks.every(c => c.ok);
  const max = Math.max(...D.volunteerHours.map(v => v.hours), 1);
  const total = D.volunteerHours.reduce((s, v) => s + v.hours, 0);
  return `<div class="head"><div><h2>Outcome report, ${esc(R.quarter.replace('Q', ' Q'))}</h2><div class="muted small">${day(R.start)} to ${day(R.end)} ${esc(R.end.slice(0, 4))}, end date not included</div></div>
    <div class="banner ${ok ? 'good' : 'bad'}">${ok ? '&#10003; All totals reconcile with the source rows' : '&#10007; Totals do not reconcile'}</div></div>
  <div class="summary rtiles">${R.measures.map(([k, v]) => `<div class="tile"><div class="k">${esc(k[0].toUpperCase() + k.slice(1))}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
  <div class="reportgrid">
    <div class="card"><div class="pad" style="padding-bottom:4px"><h3>Reconcile check</h3><div class="small muted">Each report total is counted again from the raw imported rows.</div></div>
      <table><thead><tr><th>Check</th><th class="num">Report</th><th class="num">Source</th><th>Result</th></tr></thead><tbody>
      ${R.checks.map(c => `<tr><td>${esc(c.check)}</td><td class="num">${esc(c.report)}</td><td class="num">${esc(c.source)}</td><td>${st(c.ok ? 'good' : 'bad', c.ok ? 'matches' : 'differs')}</td></tr>`).join('')}</tbody></table></div>
    <div class="card pad"><h3>Volunteer hours in ${esc(R.quarter.replace('Q', ' Q'))}</h3>
      <div class="small muted" style="margin-bottom:10px">${total.toFixed(1)} h from ${D.volunteerHours.length} volunteers, same total as the report.</div>
      <div class="bars">${D.volunteerHours.map(v => `<span>${esc(v.name)}</span><span class="track" title="${esc(v.name)}: ${v.hours} h in ${v.visits} visits"><i style="width:${(100 * v.hours / max).toFixed(1)}%"></i></span><span class="num small">${v.hours.toFixed(1)} h</span>`).join('')}</div>
    </div>
  </div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-role],[data-only-dupes],[data-go-dupes],[data-kid],[data-pick],[data-decide],[data-edit],[data-cancel]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.decide) { e.stopPropagation(); return decide(ds.decide, ds.kind, ds.value, ds.keep ? {keep: +ds.keep, drop: +ds.drop} : null); }
  if (ds.edit) { S.editing[ds.edit] = true; return render(); }
  if (ds.cancel) { delete S.editing[ds.cancel]; return render(); }
  if (ds.goDupes !== undefined) { e.stopPropagation(); return go('dupes'); }
  if (ds.tab) return go(ds.tab);
  if (ds.role) { S.role = ds.role; return render(); }
  if (ds.onlyDupes !== undefined) { S.onlyDupes = !S.onlyDupes; return render(); }
  if (ds.kid) return go('kid', {kid: +ds.kid});
  if (ds.pick) { S.kid = +ds.pick; return render(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q' && e.target.id !== 'kq') return;
  const id = e.target.id, pos = e.target.selectionStart;
  S[id] = e.target.value; render();
  const el = document.getElementById(id); el.focus(); el.setSelectionRange(pos, pos);
});
RA.onChange(c => { if (c === COL) load(); });
render(); load();
</script>
</body>
</html>
