baseURL = "https://tidepathfamily.org/"
languageCode = "en-us"
title = "Tidepath Family Alliance (demo)"
disableKinds = ["taxonomy", "term", "section", "RSS", "sitemap", "robotsTXT", "404"]
ignoreFiles = ["README\\.md$"]

# Home page plus one content page (content/how-we-operate.md).
# Content lives in data/ (site.yaml, sample.yaml, announcements.json) and layouts/.
# Hugo writes the build to public/ (Cloudflare Pages output directory).
publishDir = "public"

[outputs]
  home = ["HTML"]
  page = ["HTML"]

[params]
  themeColor = "#FFFDF9"

# Keep attribute quotes in minified HTML. The tidepath-website skill verifies the
# live page by searching for data-announcement-id="<id>" literally.
[minify.tdewolff.html]
  keepQuotes = true
