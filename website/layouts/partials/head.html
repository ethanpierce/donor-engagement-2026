{{ $site := site.Data.site -}}
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="{{ site.Params.themeColor }}">
<meta name="description" content="{{ $site.description }}">
<title>{{ $site.title }}</title>
<script>document.documentElement.classList.add('js')</script>
{{ $css := slice (resources.Get "css/base.css") (resources.Get "css/fonts.css") (resources.Get "css/main.css") (resources.Get "css/motion.css") (resources.Get "css/announcements.css") | resources.Concat "css/site.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
