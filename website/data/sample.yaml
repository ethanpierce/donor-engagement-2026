# Every person, email, phone and amount here is made up for the page.
# 555-01xx numbers and example.com / example.org addresses are reserved for fiction.
# Totals are computed in the templates.

records:
  - { id: a, name: Rosa Delgado, email: rosa.delgado@example.com, phone: "(305) 555-0142", source: Online donations }
  - { id: b, name: Rosa M. Delgado, email: rosa.delgado@example.com, phone: No phone on file, source: Gala auction }
  - { id: c, name: R. Delgado, email: rdelgado@example.org, phone: "(305) 555-0142", source: Checks in the mail }

gifts:
  - { record: a, source: Online, date: "Oct 2, 2026", amount: 50 }
  - { record: a, source: Online, date: "Sep 2, 2026", amount: 50 }
  - { record: a, source: Online, date: "Aug 2, 2026", amount: 50 }
  - { record: b, source: Auction, date: "Mar 14, 2026", amount: 320 }
  - { record: c, source: Check, date: "Dec 11, 2025", amount: 250 }
  - { record: c, source: Check, date: "Dec 9, 2024", amount: 250 }

reasons: [Same last name, First name fits, Same phone on 2 records, "Different emails: kept both"]

# The four lists as they arrive. `rosa` marks the rows that are secretly one person.
lists:
  - title: Online donation page
    rows: [{ name: Rosa Delgado, amount: 50, rosa: true }, { name: Tom Ferris, amount: 25 }, { name: Lena Ortiz, amount: 100 }]
  - title: Event tickets
    rows: [{ name: Tom Ferris, amount: 75 }, { name: Ana Ruiz, amount: 75 }, { name: D. Okafor, amount: 75 }]
  - title: Gala auction
    rows: [{ name: Lena Ortiz, amount: 140 }, { name: Rosa M. Delgado, amount: 320, rosa: true }, { name: D. Okafor, amount: 90 }]
  - title: Checks in the mail
    rows: [{ name: Marcus Bell, amount: 250 }, { name: R. Delgado, amount: 250, rosa: true }, { name: Priya Nair, amount: 100 }]

files:
  - { name: Online donations, file: online-donations.csv, rows: 214 }
  - { name: Event tickets, file: event-tickets.csv, rows: 96 }
  - { name: Gala auction, file: gala-auction.csv, rows: 41 }
  - { name: Checks in the mail, file: checks-typed-in.csv, rows: 73 }

compare:
  - { field: Name, left: Rosa Delgado, right: R. Delgado, verdict: First name fits, same: true }
  - { field: Phone, left: "(305) 555-0142", right: "(305) 555-0142", verdict: Same, same: true }
  - { field: Email, left: rosa.delgado@example.com, right: rdelgado@example.org, verdict: Different. Keeps both, same: false }

lateDonors:
  - { name: Marcus Bell, last: "Dec 12, 2024", amount: 250, timing: Every December, status: "Late: no gift last December", late: true }
  - { name: Ana Ruiz, last: "Aug 3, 2026", amount: 25, timing: "Monthly, around the 3rd", status: "Late: 2 months", late: true }
  - { name: Priya Nair, last: "Oct 18, 2026", amount: 100, timing: Every October, status: On time, late: false }

# The note scene uses the first late donor.
noteText: "Hi Marcus, thank you for your gift in December 2024. It went to kids and families here in Miami-Dade. We haven't talked since, and I wanted to say hello and see how you're doing. Could I give you a quick call this week?"
noteSign: Denise, Tidepath Family Alliance
noteYears:
  - { label: "Dec '21", state: gift }
  - { label: "Dec '22", state: gift }
  - { label: "Dec '23", state: gift }
  - { label: "Dec '24", state: gift }
  - { label: "Dec '25", state: missed }
  - { label: "Dec '26", state: due }

monthly:
  - { month: Jun, ok: true }
  - { month: Jul, ok: true }
  - { month: Aug, ok: true }
  - { month: Sep, ok: true }
  - { month: Oct, ok: true }
  - { month: Nov, ok: false }

steps:
  - { title: Bring your lists, text: "Drop in the spreadsheets you already download. Online gifts, tickets, auction, checks." }
  - { title: See why they match, text: "Every suggested match shows what lines up and what doesn't." }
  - { title: You approve, text: Nothing merges until a staff member says so. Every gift stays attached. }
  - { title: Hear about late gifts, text: "Each week, see whose regular gift is late, in time to call." }

promises:
  - Nothing merges without staff approval.
  - No giving history is ever deleted.
  - Nothing is sent to a donor without a person.
  - Donor information stays private.
